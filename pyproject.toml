[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditops"
version = "0.1.0"
description = "Evidence-grounded US and UK filing verification with deterministic tools and bounded open-model agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "jsonschema[format-nongpl]>=4.23",
  "build>=1.2",
]
retrieval = [
  "haystack-ai>=2.26,<3",
]
models = [
  "huggingface-hub>=1.0,<2",
]
inference = [
  "vllm==0.26.0; sys_platform == 'linux'",
]
pdf = [
  "pymupdf>=1.25",
  "Pillow>=11",
]

[project.scripts]
auditops = "auditops.cli:main"

[tool.setuptools.package-data]
auditops = ["specs/*.json"]

[tool.setuptools.packages.find]
include = ["auditops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
