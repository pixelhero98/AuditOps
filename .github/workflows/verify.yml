name: Verify portable release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,retrieval,models]" wheel
      - run: python -m ruff check auditops tests scripts
      - run: python -m ruff format --check auditops tests scripts
      - run: python -m pytest -q
      - run: python scripts/smoke.py
      - run: python -m auditops.agent_docs --check
      - run: python scripts/check_findings.py
      - run: python scripts/check_publication.py
      - run: python -m build
